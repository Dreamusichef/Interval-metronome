<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats & Leaderboard — Game Metronome</title>
  <link rel="icon" type="image/png" href="core/brand/logo.png?v=1.0.0">
  <link rel="apple-touch-icon" href="core/brand/logo.png?v=1.0.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core/css/tokens.css?v=1.0.0">
  <link rel="stylesheet" href="core/css/auth-bar.css?v=1.0.0">
  <link rel="stylesheet" href="assets/css/style.css?v=20260803a">
</head>
<body>
  <div class="app-container">
    <section class="rogue-section stats-section">
      <div class="stats-top">
        <!-- If opened from the game (own tab), just close to return to the live
             game page; otherwise navigate (direct visit). -->
        <a class="cloud-stats-link" href="index.html" onclick="if(window.opener&amp;&amp;!window.opener.closed){window.close();return false;}">◂ Back to app</a>
        <div class="cloud-authbar" id="cloudAuthBar"></div>
      </div>

      <h1 class="stats-title"><img class="brand-logo sm" src="core/brand/logo.png?v=1.0.0" alt="">Stats &amp; Leaderboard</h1>

      <!-- Signed-out prompt -->
      <div class="stats-signedout" id="statsSignedOut">
        <p>Sign in with Google to log your runs, track your stats, and appear on the global leaderboard.</p>
        <div class="cloud-authbar" id="cloudAuthBar2"></div>
      </div>

      <!-- Main (signed-in) -->
      <div class="stats-main" id="statsMain" hidden>
        <!-- Personal / Global / Trophies toggle -->
        <div class="stats-viewtoggle">
          <button class="stats-view-btn active" data-view="personal">Personal</button>
          <button class="stats-view-btn" data-view="global">Global</button>
          <button class="stats-view-btn" data-view="trophies">Trophies</button>
        </div>

        <!-- Instrument: Kick / Snare are separate boards -->
        <div class="stats-instr" id="statsInstrRow">
          <button class="stats-instr-btn active" data-instr="kick">Kick</button>
          <button class="stats-instr-btn" data-instr="snare">Snare</button>
        </div>

        <!-- Mode buttons -->
        <div class="stats-modes" id="statsModesRow">
          <button class="stats-mode-btn active" data-mode="timetrial">Time Trial</button>
          <button class="stats-mode-btn" data-mode="suddendeath">Sudden Death</button>
          <button class="stats-mode-btn" data-mode="gauntlet">Gauntlet</button>
        </div>

        <!-- Subdivision: scopes Personal + Global to one board at a time -->
        <div class="stats-subdivisions" id="statsSubdivRow"></div>

        <!-- Secondary selector (Global only): pick BPM (free modes) or Level (gauntlet) -->
        <div class="stats-subselect" id="statsSubSelect" hidden>
          <label class="stats-sub-label" id="statsSubLabel">BPM</label>
          <select class="rogue-select" id="statsSubSelectEl"></select>
        </div>

        <div class="stats-summary" id="statsSummary"></div>
        <div class="stats-content" id="statsContent"></div>
      </div>
    </section>

    <footer class="stats-footer">
      <a href="legal.html">Privacy &amp; Terms</a>
      <span aria-hidden="true">·</span>
      <a href="faq.html">FAQ</a>
    </footer>
  </div>

  <script src="core/js/cloud/mode.js?v=1.0.0"></script>
  <script>
    // Cloud loader: scripts are injected async (not defer), so page JS may run
    // before auth is ready. Keep mode→backend→auth→cloud-game order; bump ?v= when those change.
    (function loadCloudScripts() {
      var urls = window.__CLOUD_MODE__ === 'mock'
        ? ['core/js/cloud/profile-validation.js?v=1.0.0', 'assets/js/run-submit-validation.js?v=1', 'core/js/cloud/mock-backend.js?v=1.0.0', 'core/js/cloud/auth.js?v=1.0.0', 'assets/js/cloud-game.js?v=20260803a']
        : ['core/js/cloud/profile-validation.js?v=1.0.0', 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', 'core/js/cloud/supabase-backend.js?v=1.0.0', 'core/js/cloud/auth.js?v=1.0.0', 'assets/js/cloud-game.js?v=20260803a'];
      function load(i) {
        if (i >= urls.length) return;
        var s = document.createElement('script');
        s.src = urls[i];
        s.onload = function () { load(i + 1); };
        s.onerror = function () { console.warn('[cloud] failed to load', urls[i]); load(i + 1); };
        document.body.appendChild(s);
      }
      load(0);
    })();
  </script>
  <script defer src="core/js/game-subdivisions.js?v=1.0.0"></script>
  <script defer src="assets/js/achievements.js?v=6"></script>
  <script defer src="assets/js/stats.js?v=20260705a"></script>
</body>
</html>
